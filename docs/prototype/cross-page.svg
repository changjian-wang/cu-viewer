<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" role="img" aria-labelledby="title description">
<title id="title">CU viewer v2 - cross-page inspection sequence</title><desc id="description">Prototype v2. Static design, not a working viewer. Source and fields use licensed saved examples; error/empty/loading states are design scenarios.</desc>
<defs><style>
text { font-family:"Segoe UI",Arial,sans-serif; fill:#243145; }
.body{font-size:15px}.small{font-size:13px}.tiny{font-size:12px}
.label{font-size:14px;font-weight:600}.heading{font-size:19px;font-weight:600}
.muted{fill:#617087}.faint{fill:#77869a}.blue{fill:#0078d4}.white{fill:#fff}.error{fill:#b4232d}</style></defs><rect x="0" y="0" width="1600" height="870" rx="0" fill="#f7f9fc" stroke="none" /><text x="32" y="42" class="heading"  >Cross-page field inspection - proposed behavior</text><text x="32" y="72" class="body muted" data-max-width="1520" >Existing sample: four PDF pages; all grounded extracted fields are on page 1. No page-4 field is invented.</text><rect x="32" y="100" width="744" height="339" rx="6" fill="#fff" stroke="#d9e1eb" /><circle cx="58" cy="129" r="13" fill="#0078d4"/><text x="58" y="134" class="label white"  text-anchor="middle">1</text><text x="82" y="134" class="heading" data-max-width="670" >Start on page 4</text><rect x="51" y="153" width="172" height="238" rx="0" fill="#fff" stroke="#dbe2eb" /><image href="source-page-4.png" x="52" y="154" width="170" height="236" preserveAspectRatio="none"/><rect x="255" y="185" width="498" height="95" rx="4" fill="#f6f8fb" stroke="#dbe2eb" /><text x="272" y="211" class="label" data-max-width="460" >No selected field</text><text x="272" y="239" class="body" data-max-width="460" >Field list remains available on the right.</text><text x="272" y="264" class="small muted" data-max-width="460" >Source page and field identity remain separate.</text><text x="255" y="313" class="small muted" data-max-width="496" >No active field; page controls work independently.</text><text x="255" y="345" class="small blue" data-max-width="496" >Current page 4 / 4</text><text x="52" y="420" class="small muted" data-max-width="700" >Step 1 - page 4 / 4 - static state</text><rect x="824" y="100" width="744" height="339" rx="6" fill="#fff" stroke="#d9e1eb" /><circle cx="850" cy="129" r="13" fill="#0078d4"/><text x="850" y="134" class="label white"  text-anchor="middle">2</text><text x="874" y="134" class="heading" data-max-width="670" >Hover AmountDue / Amount</text><rect x="843" y="153" width="184" height="238" rx="0" fill="#fff" stroke="#dbe2eb" /><image href="source-page.png" x="844" y="154" width="182" height="236" preserveAspectRatio="none"/><polygon points="1001.6505411764706,326.7369818181818 1013.7353411764706,326.7369818181818 1013.7353411764706,330.1933090909091 1001.6505411764706,330.1933090909091" fill="#d13438" fill-opacity="0.08" stroke="#d13438" stroke-width="1.8" stroke-dasharray="4 3"/><rect x="1047" y="185" width="498" height="95" rx="4" fill="#fff9f9" stroke="#dbe2eb" /><text x="1064" y="211" class="label" data-max-width="460" >Preview: AmountDue / Amount</text><text x="1064" y="239" class="body" data-max-width="460" >610   |   34.1%   |   source p.1</text><text x="1064" y="264" class="small muted" data-max-width="460" >Source page and field identity remain separate.</text><text x="1047" y="313" class="small muted" data-max-width="496" >Preview the page-1 region. No persistent pin yet.</text><text x="1047" y="345" class="small blue" data-max-width="496" >Pointer exit: clear preview; keep page 1.</text><text x="844" y="420" class="small muted" data-max-width="700" >Step 2 - page 1 / 4 - static state</text><rect x="32" y="463" width="744" height="339" rx="6" fill="#fff" stroke="#d9e1eb" /><circle cx="58" cy="492" r="13" fill="#0078d4"/><text x="58" y="497" class="label white"  text-anchor="middle">3</text><text x="82" y="497" class="heading" data-max-width="670" >Click to pin the field</text><rect x="51" y="516" width="184" height="238" rx="0" fill="#fff" stroke="#dbe2eb" /><image href="source-page.png" x="52" y="517" width="182" height="236" preserveAspectRatio="none"/><polygon points="209.6505411764706,689.7369818181818 221.7353411764706,689.7369818181818 221.7353411764706,693.1933090909091 209.6505411764706,693.1933090909091" fill="#d13438" fill-opacity="0.13" stroke="#d13438" stroke-width="1.8" /><rect x="255" y="548" width="498" height="95" rx="4" fill="#eaf3ff" stroke="#dbe2eb" /><text x="272" y="574" class="label" data-max-width="460" >Pinned: AmountDue / Amount</text><text x="272" y="602" class="body" data-max-width="460" >610   |   34.1%   |   source p.1</text><text x="272" y="627" class="small muted" data-max-width="460" >Source page and field identity remain separate.</text><text x="255" y="676" class="small muted" data-max-width="496" >610, confidence 34.1%; keep highlight after pointer exit.</text><text x="255" y="708" class="small blue" data-max-width="496" >Clear selection removes the pin and highlight.</text><text x="52" y="783" class="small muted" data-max-width="700" >Step 3 - page 1 / 4 - static state</text><rect x="824" y="463" width="744" height="339" rx="6" fill="#fff" stroke="#d9e1eb" /><circle cx="850" cy="492" r="13" fill="#0078d4"/><text x="850" y="497" class="label white"  text-anchor="middle">4</text><text x="874" y="497" class="heading" data-max-width="670" >Manually navigate to page 4</text><rect x="843" y="516" width="172" height="238" rx="0" fill="#fff" stroke="#dbe2eb" /><image href="source-page-4.png" x="844" y="517" width="170" height="236" preserveAspectRatio="none"/><rect x="1047" y="548" width="498" height="95" rx="4" fill="#eaf3ff" stroke="#dbe2eb" /><text x="1064" y="574" class="label" data-max-width="460" >Pinned: AmountDue / Amount</text><text x="1064" y="602" class="body" data-max-width="460" >610   |   34.1%   |   source p.1</text><text x="1064" y="627" class="small muted" data-max-width="460" >Its region is not on the displayed page.</text><text x="1047" y="676" class="small muted" data-max-width="496" >Keep the field selected, but show no page-4 polygon.</text><text x="1047" y="708" class="small blue" data-max-width="496" >Click its p.1 locator to return. Do not snap back.</text><text x="844" y="783" class="small muted" data-max-width="700" >Step 4 - page 4 / 4 - static state</text><text x="32" y="844" class="small muted" data-max-width="1536" >Manual page navigation ends transient preview and takes precedence over automatic restoration. Review before implementation.</text></svg>
