name: Core build and package checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run verify:bundle
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --ignore-scripts --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-build
          path: |
            dist
            dist-demo
          if-no-files-found: error

  viewer-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check native Bash export tools
        run: bash scripts/package-release.sh --help
      - run: npm run package:release
      - run: npm run test:release
        env:
          CU_VIEWER_TEST_EXPORT: dist-viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-release-candidate
          path: |
            dist-viewer/viewer.zip
            dist-viewer/manifest.json
          if-no-files-found: error

  browser:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run functional Chrome and Edge suites
        run: >-
          npx playwright test
          tests/e2e/prototype.spec.ts
          tests/e2e/rich-results.spec.ts
          tests/e2e/source-inputs.spec.ts
          tests/e2e/image-formats.spec.ts
          tests/e2e/ui-parity.spec.ts
          tests/e2e/toolbar-legend.spec.ts
          --project=chrome
          --project=edge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
          if-no-files-found: ignore

  performance:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:performance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: performance-failures
          path: test-results/performance
          if-no-files-found: ignore

  packed-consumers:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Use npm with corrected optional peer resolution
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - run: npm run verify:consumer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packed-consumer-failures
          path: test-results
          if-no-files-found: ignore

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run 600-round Chrome and Edge stress suite
        run: npx playwright test tests/e2e/stress.spec.ts --project=chrome --project=edge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-failures
          path: test-results
          if-no-files-found: ignore
