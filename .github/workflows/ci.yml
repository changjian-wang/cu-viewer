name: Core build and package checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run verify:bundle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build pytest
      - run: npm run build:python
      - run: python -m pytest -c python/pyproject.toml python/tests tools/test_export_cli_viewer.py
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm pack --ignore-scripts --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-build
          path: |
            dist
            dist-demo
            python/dist
          if-no-files-found: error

  browser:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run functional Chrome and Edge suites
        run: >-
          npx playwright test
          tests/e2e/prototype.spec.ts
          tests/e2e/rich-results.spec.ts
          tests/e2e/source-inputs.spec.ts
          tests/e2e/image-formats.spec.ts
          --project=chrome
          --project=edge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results
          if-no-files-found: ignore

  performance:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:performance
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: performance-failures
          path: test-results/performance
          if-no-files-found: ignore

  packed-consumers:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:consumer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packed-consumer-failures
          path: test-results
          if-no-files-found: ignore

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CU_VERIFY_PRODUCT_SCREENSHOTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run 600-round Chrome and Edge stress suite
        run: npx playwright test tests/e2e/stress.spec.ts --project=chrome --project=edge
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stress-failures
          path: test-results
          if-no-files-found: ignore

  heif-codec:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Rust toolchain
        run: |
          rustup toolchain install 1.94.1 --profile minimal --no-self-update
          rustup default 1.94.1
          rustup target add wasm32-unknown-unknown
      - name: Install locked wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Reproduce packaged HEIF decoder
        run: .\tools\build-heic-codec.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduced-heif-codec
          path: |
            assets/heif/heic_decoder.js
            assets/heif/heic_decoder_bg.wasm
          if-no-files-found: error
      - name: Verify generated decoder is unchanged
        run: git diff --exit-code -- assets/heif
